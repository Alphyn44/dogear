name: verify

# Reusable, so ci.yml and release.yml run the SAME nine steps in the same order.
#
# G4's criterion is that publishing happens only after `npm run verify` passes "in the same
# workflow". A called workflow's jobs run inside the caller's run, so `needs: verify` in
# release.yml is a real gate rather than a hope about a previous run. Duplicating the steps
# into release.yml instead would create a second copy of an ordering this repo justifies in
# comments, and the copy exercised once per release is the one that would drift.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}

    strategy:
      # Don't cancel the other legs when one fails. Whether a break is version-specific or
      # platform-specific is most of the diagnosis, and a cancelled matrix answers neither.
      fail-fast: false
      matrix:
        # H2 (#54): an explicit include list, not a cross product, because the two axes are
        # not independent. The Node axis exists to prove the `engines` floors; the platform
        # axis exists to prove path, casing and shim handling, and none of THOSE failures are
        # Node-version-specific. Three-by-three would be nine jobs to learn what these five
        # already say, and Windows runners are the slowest on offer.
        #
        # The Node versions are the intersection of Vite's engines (^20.19.0 || >=22.12.0)
        # and vitest's (^20.0.0 || ^22.0.0 || >=24.0.0). The two floors are the lowest
        # versions package.json `engines` claims; 24 is what development happens on. Node 21
        # and 23 are correctly absent, since vitest does not support them.
        include:
          - os: ubuntu-latest
            node: '20.19.0'
          - os: ubuntu-latest
            node: '22.12.0'
          - os: ubuntu-latest
            node: '24'
          # dogear is developed on Windows and, until H2, was never tested there. Two pieces
          # of code exist BECAUSE of Windows and were both reasoned out rather than observed
          # failing: registryKey upper-cases the drive letter, since Node reports its case
          # differently depending on how the process started — `dogear init` from a shell
          # versus Vite from an npm script is exactly that pair — and everything init writes
          # points at `node <path>` rather than `dogear`, because a global npm bin here is a
          # .cmd shim the exec form cannot run. This leg is what turns either into a result.
          # There is a softer third reason: several suites compare paths, and a lowercase
          # drive letter has previously failed every test in the repository at load.
          - os: windows-latest
            node: '24'
          # A POSIX second opinion, nearly free once the matrix is a matrix. It matters less
          # than Windows — the runner already in use is POSIX too — but `*.local` mDNS
          # hostnames in DEFAULT_HOSTS are a macOS convention.
          - os: macos-latest
            node: '24'

    name: verify (${{ matrix.os }}, node ${{ matrix.node }})

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run format:check

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # A4: spawns the built dist/cli.js the way Claude Code spawns it, asserting an empty
      # queue puts zero bytes on stdout and that the whole invocation stays well inside the
      # hook's 10s timeout. Needs the build above; runs before the two slower example steps
      # so a regression here fails fast.
      - run: npm run test:built

      # The example typechecks only after the build, because it resolves dogear-vite
      # through its exports map to dist/ rather than to source.
      - run: npm run typecheck:example

      # Builds the consumer app, which is what the leak check below scans.
      - run: npm run build:example

      # F1 layer 2: production-builds a fixture that gates a dynamic import of core behind
      # `import.meta.env.DEV`. The leak check below asserts the branch was eliminated.
      - run: npm run build:fixtures

      # F2: fails the build if dogear's sentinel, source attribute, or package specifier
      # reached production output, naming every offending file. Must run after both
      # builds: it scans the example's dist AND packages/core/dist/noop.js.
      - run: npm run check:leak
