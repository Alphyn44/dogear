version: 2

updates:
  # The npm ecosystem. One entry covers the workspaces too, because Dependabot reads the root
  # manifest's `workspaces` array and resolves the lockfile as a whole, which is the only
  # correct way to update a repository with a single root `package-lock.json`. Separate
  # per-package entries would each try to patch that one lockfile and conflict.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Dev tooling moves constantly and none of it ships to a user: tsup, vitest,
      # prettier, typescript, happy-dom and the type packages. Grouped so a quiet week is
      # one pull request rather than six, each of which costs a full nine-step verify run.
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Vite is a peerDependency with a deliberate floor, and `engines` is pinned to Vite's
      # own Node range. A major here is a decision about what dogear supports, not an
      # upgrade to take automatically. It belongs in a story, with the README, the brief
      # and the CI matrix moving together.
      - dependency-name: vite
        update-types: ['version-update:semver-major']

  # Not optional, and arguably the more important of the two. The workflows pin
  # actions/checkout@v5 and actions/setup-node@v5 by MAJOR tag, and a major tag is mutable:
  # it moves when the action publishes. Dependabot on this ecosystem is what surfaces an
  # advisory against a tag that changed underneath us, which matters more here than for most
  # repositories: release.yml holds `id-token: write` against a live npm trusted publisher,
  # so a compromised action in that job could publish as us.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
